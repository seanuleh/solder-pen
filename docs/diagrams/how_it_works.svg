<circle cx="655.0" cy="330.0" r="3" fill="#777"/>
<text x="640.0" y="91.5" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="start">3  Funnel + eyelet</text>
<text x="640.0" y="110.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="start">centres the wire on the axis</text>
