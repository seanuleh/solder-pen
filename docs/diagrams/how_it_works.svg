<text x="790.0" y="629.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="start">ø7, 14 teeth; ø18 thumbwheel pokes out the side</text>
<line x1="943.0" y1="287.5" x2="1000.0" y2="97.5" stroke="#777" stroke-width="1.2"/>
