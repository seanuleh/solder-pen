<text x="220.0" y="91.5" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="start">1  Fixed spool</text>
<text x="220.0" y="110.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="start">single-layer coil in a helical groove; never turns</text>
<line x1="561.2" y1="421.5" x2="430.0" y2="562.5" stroke="#777" stroke-width="1.2"/>
<circle cx="561.2" cy="421.5" r="3" fill="#777"/>
<text x="430.0" y="580.5" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#222" text-anchor="start">2  Peels over the lip</text>
<text x="430.0" y="599.5" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#777" text-anchor="start">front turn first, so nothing crosses</text>
